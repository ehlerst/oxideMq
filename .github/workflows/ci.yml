name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check-and-lint:
    name: Formatting & Clippy Discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check

      - name: Strict Clippy Linter (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features

  test:
    name: Pure Rust Workspace Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run Workspace Tests
        run: cargo test --workspace --all-targets

  testcontainers-java:
    name: Java Testcontainers Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build oxidemq Release Binary
        run: cargo build --release -p oxidemq-server

      - name: Prepare Docker Build Context
        run: |
          mkdir -p docker-bin/amd64
          cp target/release/oxidemq docker-bin/amd64/oxidemq
          chmod +x docker-bin/amd64/oxidemq
          docker build --build-arg TARGETARCH=amd64 -t ehlers320/oxidemq:latest .

      - name: Run Rust Testcontainers Suite
        run: cargo test -p oxidemq-compat-tests --test container_test
        env:
          RUN_TESTCONTAINERS: "1"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Package Java Client Image
        run: |
          mvn -B clean package -DskipTests
          docker build -t oxidemq-kafka-client:latest -f Dockerfile.client .
        working-directory: compat/java-testcontainers

      - name: Start oxideMq Background Daemon
        run: |
          ./target/release/oxidemq start --kafka-port 9092 --admin-port 9093 &
          sleep 2

      - name: Run Java Testcontainers Suite
        run: mvn -B test
        working-directory: compat/java-testcontainers
