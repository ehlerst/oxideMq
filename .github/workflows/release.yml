name: release

on:
  push:
    branches:
      - main
      - master
      - 'v*'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo Test
        run: cargo test --workspace --all-targets --all-features

  build:
    name: Build - ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Binary
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo build --release --target ${{ matrix.target }} -p oxidemq-server
          else
            cargo build --release --target ${{ matrix.target }} -p oxidemq-server
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxidemq-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/oxidemq

  publish-docker:
    name: Publish Multi-Arch Docker Image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: oxidemq-x86_64-unknown-linux-gnu
          path: docker-bin/amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: oxidemq-aarch64-unknown-linux-gnu
          path: docker-bin/arm64

      - name: Prepare binaries
        run: |
          chmod +x docker-bin/amd64/oxidemq
          chmod +x docker-bin/arm64/oxidemq

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ehlers320
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ehlers320/oxidemq
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,format=short
            type=ref,event=tag
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
