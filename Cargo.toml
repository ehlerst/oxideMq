[workspace]
resolver = "2"
members = [
    "crates/oxidemq-core",
    "crates/oxidemq-wal",
    "crates/oxidemq-s3stream",
    "crates/oxidemq-protocol",
    "crates/oxidemq-broker",
    "crates/oxidemq-server",
    "crates/oxidemq-benchmarks",
    "crates/oxidemq-compat-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["oxideMq Contributors"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/ehlerst/oxideMq"
readme = "README.md"

[workspace.dependencies]
# Internal workspace crates
oxidemq-core = { path = "crates/oxidemq-core" }
oxidemq-wal = { path = "crates/oxidemq-wal" }
oxidemq-s3stream = { path = "crates/oxidemq-s3stream" }
oxidemq-protocol = { path = "crates/oxidemq-protocol" }
oxidemq-broker = { path = "crates/oxidemq-broker" }
oxidemq-server = { path = "crates/oxidemq-server" }

# Async runtime & networking
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = { version = "1.10", features = ["serde"] }
futures = "0.3"

# HTTP server & admin APIs
axum = { version = "0.8", features = ["tokio", "http2"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
http = "1.2"
http-body-util = "0.1"

# Serialization, hashing & error handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
crc32fast = "1.4"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Concurrency & primitives
parking_lot = "0.12"
crossbeam-channel = "0.5"
dashmap = "6.1"
fastrand = "2.3"

# CLI & logging
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Benchmarking & Testing
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
tempfile = "3.17"

# Compression codecs
snap = "1.1"
lz4_flex = { version = "0.14", features = ["frame"] }
zstd = "0.14"
flate2 = "1.1"

# AWS S3 Cloud Storage Backend
aws-sdk-s3 = "1"
aws-config = "1"
aws-credential-types = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true
