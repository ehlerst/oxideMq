<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <style>
    .node { fill: #f0f8ff; stroke: #000080; stroke-width: 2; }
    .node-text { font-family: Arial, sans-serif; font-size: 14px; }
    .edge { stroke: #666; stroke-width: 2; marker-end: url(#arrowhead); }
    .api-key { fill: #ffe4b5; stroke: #daa520; stroke-width: 2; }
    .api-text { font-family: Arial, sans-serif; font-size: 12px; }
    .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; }
  </style>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">oxideMq Architecture</text>
  
  <!-- Core Components -->
  <rect x="300" y="80" width="200" height="60" class="node" rx="10"/>
  <text x="400" y="115" text-anchor="middle" class="node-text">Kafka Protocol Layer</text>
  
  <rect x="300" y="200" width="200" height="60" class="node" rx="10"/>
  <text x="400" y="235" text-anchor="middle" class="node-text">Broker Engine</text>
  
  <rect x="300" y="320" width="200" height="60" class="node" rx="10"/>
  <text x="400" y="355" text-anchor="middle" class="node-text">Cluster State</text>
  
  <!-- API Keys -->
  <rect x="100" y="100" width="120" height="40" class="api-key" rx="5"/>
  <text x="160" y="125" text-anchor="middle" class="api-text">LeaderAndIsr (4)</text>
  
  <rect x="100" y="160" width="120" height="40" class="api-key" rx="5"/>
  <text x="160" y="185" text-anchor="middle" class="api-text">StopReplica (5)</text>
  
  <rect x="100" y="220" width="120" height="40" class="api-key" rx="5"/>
  <text x="160" y="245" text-anchor="middle" class="api-text">UpdateMetadata (6)</text>
  
  <rect x="100" y="280" width="120" height="40" class="api-key" rx="5"/>
  <text x="160" y="305" text-anchor="middle" class="api-text">ControlledShutdown (7)</text>
  
  <!-- Connections -->
  <line x1="500" y1="110" x2="650" y2="110" class="edge"/>
  <line x1="500" y1="230" x2="650" y2="230" class="edge"/>
  <line x1="500" y1="350" x2="650" y2="350" class="edge"/>
  
  <!-- API to Protocol -->
  <line x1="220" y1="120" x2="300" y2="110" class="edge"/>
  <line x1="220" y1="180" x2="300" y2="230" class="edge"/>
  <line x1="220" y1="240" x2="300" y2="350" class="edge"/>
  <line x1="220" y1="300" x2="300" y2="470" class="edge"/>
  
  <!-- Protocol to Broker -->
  <line x1="500" y1="110" x2="650" y2="110" class="edge"/>
  <line x1="500" y1="230" x2="650" y2="230" class="edge"/>
  <line x1="500" y1="350" x2="650" y2="350" class="edge"/>
  
  <!-- Legend -->
  <rect x="550" y="450" width="200" height="100" fill="#f8f8f8" stroke="#ccc"/>
  <text x="650" y="470" text-anchor="middle" class="node-text">Legend</text>
  <rect x="560" y="480" width="15" height="15" class="api-key"/>
  <text x="580" y="492" class="api-text">API Keys</text>
  <rect x="560" y="500" width="15" height="15" class="node"/>
  <text x="580" y="512" class="api-text">Components</text>
</svg>